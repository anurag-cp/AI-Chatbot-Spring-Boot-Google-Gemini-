<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(760px, 100%); height: min(800px, calc(100vh - 48px)); min-height: 440px; display: flex; flex-direction: column; overflow: hidden; background: #fff; border: 1px solid #e4e8f0; border-radius: 20px; box-shadow: 0 18px 60px #25345a14; }
    header { padding: 22px 26px; border-bottom: 1px solid #e9edf4; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    header p { margin: 5px 0 0; color: #677187; font-size: 14px; }
    #messages { flex: 1; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 24px; }
    .message { max-width: min(85%, 580px); padding: 13px 16px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .assistant { align-self: flex-start; background: #f0f3f9; border-bottom-left-radius: 5px; }
    .user { align-self: flex-end; color: #fff; background: #4058d6; border-bottom-right-radius: 5px; }
    .error { align-self: flex-start; color: #9a2828; background: #fff0ef; border: 1px solid #ffd8d5; }
    form { display: flex; gap: 12px; align-items: end; padding: 18px 20px; border-top: 1px solid #e9edf4; }
    textarea { flex: 1; min-height: 48px; max-height: 150px; resize: vertical; padding: 13px 14px; border: 1px solid #d8deea; border-radius: 12px; font: inherit; outline: none; }
    textarea:focus { border-color: #697be0; box-shadow: 0 0 0 3px #4058d61a; }
    button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; color: #fff; background: #4058d6; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 520px) { body { padding: 0; } main { height: 100vh; min-height: 0; border: 0; border-radius: 0; } header { padding: 18px; } #messages { padding: 18px; } form { padding: 14px; } button { padding: 0 15px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Chatbot</h1>
      <p>Ask a question and Gemini will respond.</p>
    </header>
    <section id="messages" aria-live="polite" aria-label="Conversation">
      <div class="message assistant">Hi! What would you like to ask?</div>
    </section>
    <form id="chat-form">
      <textarea id="message-input" maxlength="8000" placeholder="Write your message…" aria-label="Your message" required></textarea>
      <button id="send-button" type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const messages = document.getElementById('messages');

    function addMessage(text, kind) {
      const message = document.createElement('div');
      message.className = `message ${kind}`;
      message.textContent = text;
      messages.append(message);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      addMessage(message, 'user');
      input.value = '';
      sendButton.disabled = true;
      sendButton.textContent = 'Thinking…';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'The request could not be completed.');
        addMessage(data.reply || 'Gemini returned an empty response.', 'assistant');
      } catch (error) {
        addMessage(error.message || 'Could not connect to the chatbot.', 'error');
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
        input.focus();
      }
    });
  </script>
</body>
</html>
